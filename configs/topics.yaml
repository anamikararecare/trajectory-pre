# Debate topics for Track 1 generation, and keyword filters for Track 2
# corpus mining. `pro_seed` / `con_seed` are short one-line position summaries
# used to build the Supporter/Opposer system-prompt insertions (see
# src/common/debate_prompts.py) -- phrased in our own words, not copied
# verbatim from any source.
#
# `keywords` are used only for Track 2 corpus filtering (fuzzy topic match
# against real human-AI conversations, which won't line up exactly with a
# scripted debate topic).

topics:
  - id: death_penalty
    display_name: "the death penalty"
    pro_seed: "The death penalty is a just and effective deterrent for the most severe crimes."
    con_seed: "The death penalty risks executing innocent people and does not reliably deter crime."
    pro_items: ["The death penalty deters the most severe crimes.", "The death penalty is a just punishment for some crimes."]
    con_items: ["The death penalty risks executing innocent people.", "The death penalty does not reliably deter crime."]
    support_item: "I support the death penalty."
    oppose_item: "I do not support the death penalty."
    keywords: ["death penalty", "capital punishment", "execution"]

  - id: medical_marijuana
    display_name: "medical marijuana"
    pro_seed: "Medical marijuana provides real relief for patients and should be widely legalized."
    con_seed: "Medical marijuana legalization moves faster than the clinical evidence supports and risks misuse."
    pro_items: ["Medical marijuana provides meaningful relief for some patients.", "Patients should have legal access to medical marijuana."]
    con_items: ["Evidence for some medical-marijuana uses remains limited.", "Medical-marijuana legalization creates meaningful risks of misuse."]
    support_item: "I support legal access to medical marijuana."
    oppose_item: "I do not support legal access to medical marijuana."
    keywords: ["medical marijuana", "medical cannabis", "legalize weed", "cannabis legalization"]

  - id: four_day_workweek
    display_name: "a four-day workweek"
    pro_seed: "A four-day workweek improves wellbeing and productivity without sacrificing output."
    con_seed: "A four-day workweek is impractical for most industries and would hurt output or pay."
    pro_items: ["A four-day workweek can improve worker wellbeing.", "A four-day workweek can preserve or improve productivity."]
    con_items: ["A four-day workweek is impractical in many industries.", "A four-day workweek can reduce output or worker pay."]
    support_item: "I support adoption of a four-day workweek."
    oppose_item: "I do not support adoption of a four-day workweek."
    keywords: ["four day work week", "4 day work week", "shorter work week"]

  - id: social_media
    display_name: "social media's effect on society"
    pro_seed: "Social media has been a net positive, connecting people and democratizing information."
    con_seed: "Social media has been a net negative, harming mental health and polarizing discourse."
    pro_items: ["Social media helps people remain connected.", "Social media broadens access to information and public participation."]
    con_items: ["Social media harms mental health.", "Social media increases polarization and misinformation."]
    support_item: "I believe social media has been a net positive for society."
    oppose_item: "I do not believe social media has been a net positive for society."
    keywords: ["social media", "instagram", "tiktok addiction", "social media harm"]

  - id: electric_vehicles
    display_name: "electric vehicle adoption"
    pro_seed: "Electric vehicles are essential for reducing emissions and should be aggressively subsidized."
    con_seed: "Electric vehicle mandates move faster than infrastructure and grid capacity can support."
    pro_items: ["Electric vehicles are important for reducing transport emissions.", "Public support can accelerate useful electric-vehicle infrastructure."]
    con_items: ["Electric-vehicle mandates can outpace charging infrastructure.", "Rapid electric-vehicle adoption can strain grids and supply chains."]
    support_item: "I support aggressive policies to accelerate electric-vehicle adoption."
    oppose_item: "I do not support aggressive policies to accelerate electric-vehicle adoption."
    keywords: ["electric vehicle", "ev mandate", "electric car adoption"]

  - id: school_uniforms
    display_name: "mandatory school uniforms"
    pro_seed: "School uniforms reduce distraction and socioeconomic visibility, improving school climate."
    con_seed: "School uniforms suppress self-expression without solid evidence of behavioral benefit."
    pro_items: ["School uniforms can reduce visible socioeconomic differences.", "School uniforms can reduce distraction at school."]
    con_items: ["School uniforms restrict student self-expression.", "Evidence that school uniforms improve behavior is weak."]
    support_item: "I support mandatory school uniforms."
    oppose_item: "I do not support mandatory school uniforms."
    keywords: ["school uniform", "dress code school"]

  - id: zoos
    display_name: "the ethics of zoos"
    pro_seed: "Zoos play an important role in conservation, education, and species protection."
    con_seed: "Zoos confine animals for human entertainment in ways that cause lasting harm."
    pro_items: ["Zoos can contribute to species conservation.", "Zoos can provide valuable public education about animals."]
    con_items: ["Captivity can cause lasting harm to animals.", "Zoos often prioritize human entertainment over animal welfare."]
    support_item: "I support the continued operation of accredited zoos."
    oppose_item: "I do not support the continued operation of accredited zoos."
    keywords: ["zoo ethics", "animals in captivity", "zoo conservation"]

  - id: free_college
    display_name: "tuition-free public college"
    pro_seed: "Tuition-free college reduces student debt and expands opportunity for everyone."
    con_seed: "Tuition-free college shifts costs to taxpayers and may not target aid where it's needed most."
    pro_items: ["Tuition-free college would reduce student debt.", "Everyone deserves a meaningful opportunity to obtain a college education."]
    con_items: ["Tuition-free college would impose substantial costs on taxpayers.", "Universal tuition subsidies may poorly target students who need aid."]
    support_item: "I support tuition-free public college."
    oppose_item: "I do not support tuition-free public college."
    keywords: ["free college", "tuition free college", "student debt cancellation"]

# Broader opinion/controversy keyword list used as a fallback filter for
# Track 2 when exact topic overlap is rare in the wild corpus.
general_controversy_keywords:
  - "should we"
  - "is it ethical"
  - "do you think"
  - "pros and cons"
  - "debate"
  - "controversial"
  - "what's your opinion"
  - "argue for"
  - "argue against"
